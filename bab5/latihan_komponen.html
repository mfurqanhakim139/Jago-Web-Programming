<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Komponen Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">TokoSaya</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuKu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuKu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Keranjang</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            <strong>Selamat Datang!</strong> Anda berhasil mendapatkan diskon 50%.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row g-4">
            
            <div class="col-12 col-md-4">
                <div class="card shadow">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Produk">
                    <div class="card-body">
                        <h5 class="card-title">Paket Belajar Coding</h5>
                        <p class="card-text">Belajar HTML & CSS dari nol sampai mahir.</p>
                        <button type="button" class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#modalBeli">
                            Detail Paket
                        </button>
                    </div>
                </div>
            </div>

            <!-- Catatan: di buku, kode setelah bagian ini tidak terlihat pada potongan yang tersedia di dokumen.
                 Agar file tetap bisa dijalankan, berikut saya lengkapi dengan modal + script standar Bootstrap. -->

        </div>
    </div>

    <!-- Modal (pelengkap agar runnable) -->
    <div class="modal fade" id="modalBeli" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Detail Paket</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p>Ini contoh modal Bootstrap untuk menampilkan detail paket.</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
            <button type="button" class="btn btn-primary">Beli</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
